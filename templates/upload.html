{% extends "base.html" %}
{% block title %}Upload biểu mẫu{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h4 class="mb-3"><i class="bi bi-upload"></i> Upload biểu mẫu mới</h4>
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Tên biểu mẫu <span class="text-danger">*</span></label>
        <input name="title" value="{{ title }}" class="form-control form-control-lg" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="2">{{ description }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Nhóm</label>
        <input name="category" value="{{ category }}" class="form-control" list="categoryOptions" placeholder="vd: Kho, Bán hàng, Kế toán, Nhân sự…">
        <datalist id="categoryOptions"></datalist>
        <small class="text-muted">Chọn nhóm đã có hoặc gõ tên nhóm mới.</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Tags (ngăn cách bằng dấu phẩy)</label>
        <input name="tags" value="{{ tags }}" class="form-control" placeholder="vd: thu đổi, biên bản, pnj">
      </div>
      <div class="mb-3">
        <label class="form-label">File <span class="text-danger">*</span></label>
        <input name="file" type="file" class="form-control form-control-lg" accept=".docx,.xlsx,.pdf" required>
        <small class="text-muted">docx / xlsx / pdf — tối đa 3MB</small>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-lg flex-grow-1"><i class="bi bi-check-lg"></i> Lưu</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-lg">Huỷ</a>
      </div>
    </form>
  </div>
</div>
<script>
  // Load categories vào datalist
  fetch('{{ url_for("api_categories") }}')
    .then(r => r.json())
    .then(list => {
      const dl = document.getElementById('categoryOptions');
      list.forEach(c => { const o = document.createElement('option'); o.value = c; dl.appendChild(o); });
    })
    .catch(() => {});
</script>
{% endblock %}
