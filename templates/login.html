{% extends "base.html" %}
{% block title %}Đăng nhập · Biểu mẫu PNJ{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="card-title mb-3 text-center">
          <i class="bi bi-folder2-open text-warning"></i>
          Biểu mẫu PNJ 1305
        </h5>
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="on">
          <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input name="username" class="form-control form-control-lg" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input name="password" type="password" class="form-control form-control-lg" required>
          </div>
          <button class="btn btn-primary w-100 btn-lg">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
