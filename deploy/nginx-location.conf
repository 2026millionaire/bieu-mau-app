# Thêm vào block server của dangkhoa.io.vn trong /etc/nginx/sites-enabled/phieuck
# Ở ROOT domain (không phải dưới /bk/ vì phieu-ck đã có route /bieu-mau riêng)

location /bieu-mau/ {
    proxy_pass http://127.0.0.1:5053/bieu-mau/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 5M;  # cho phép upload 3MB + buffer
}
location = /bieu-mau { return 301 /bieu-mau/; }
